<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>New Horizon Case Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="loginScreen" class="screen">

        <div class="login-card">

            <h1>NEW HORIZON</h1>

            <p class="subtitle">
                Case Management System
            </p>

            <form id="loginForm">

                <label for="email">
                    Email
                </label>

                <input 
                    type="email"
                    id="email"
                    placeholder="Email address"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input 
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Sign In
                </button>

                <p id="loginError"></p>

            </form>

        </div>

    </div>

    <div id="dashboardScreen" class="screen hidden">

        <header class="topbar">

            <div>
                <strong>NEW HORIZON</strong>
                <span>Case Manager</span>
            </div>

            <button id="logoutButton">
                Sign Out
            </button>

        </header>

        <main class="dashboard">

            <h1>Dashboard</h1>

            <p id="welcomeMessage">
                Welcome.
            </p>

        </main>

    </div>

    <script type="module" src="app.js"></script>

</body>
</html>
